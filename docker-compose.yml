services:
 db:
  image: postgres:latest
  container_name: pc_builder
  restart: unless-stopped
  environment:
   POSTGRES_USER: ${POSTGRES_USER}
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
   POSTGRES_DB: ${POSTGRES_DB}
  ports:
   - "5432:5432"
  volumes:
   - db-data:/var/lib/postgresql/data

volumes:
 db-data:
